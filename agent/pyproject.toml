[project]
name = "cmprssn-signal"
version = "0.1.0"
description = "Telegram signal bot for CMPRSSN practitioner community"
requires-python = ">=3.11"
dependencies = [
    "twikit>=2.3.1",
    "atproto>=0.0.55",
    "httpx>=0.27",
    "feedparser>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[tool.ruff]
line-length = 100
target-version = "py311"
